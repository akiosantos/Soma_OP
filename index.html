<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema Soma OP</title>

<link rel="icon" href="/static/icone.ico" type="image/x-icon">

<style>
body {
    font-family: Arial;
    background: #f4f6f8;

    display: flex;
    justify-content: center;  /* horizontal */
    align-items: center;      /* vertical */

    height: 100vh;
    margin: 0;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 400px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

button {
    background: #2e86de;
    color: white;
    border: none;
    padding: 10px 20px;
    margin-top: 20px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #1b4f72;
}

</style>
</head>

<body>

<div class="container">
    <h2>📄 Soma de OP</h2>

    <input type="file" id="arquivo" accept=".pdf"><br>

    <button onclick="enviar()">Processar</button>

    <p id="status"></p>
</div>

<script>
async function enviar() {
    const fileInput = document.getElementById("arquivo");
    const status = document.getElementById("status");

    if (!fileInput.files.length) {
        alert("Selecione um PDF!");
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    status.innerText = "Processando...";

    const response = await fetch("/processar", {
        method: "POST",
        body: formData
    });

    if (response.ok) {
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "resultado.csv";
        a.click();

        status.innerText = "✅ Processado com sucesso!";
    } else {
        status.innerText = "❌ Erro ao processar";
    }
}
</script>

</body>
</html>
